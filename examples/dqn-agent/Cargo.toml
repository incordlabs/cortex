[package]
name = "dqn-agent"
edition.workspace = true
license.workspace = true
readme.workspace = true
version.workspace = true

[features]
default = ["cortex/tui"]
ndarray = ["cortex/ndarray"]
ndarray-blas-accelerate = ["cortex/ndarray", "cortex/accelerate"]
ndarray-blas-netlib = ["cortex/ndarray", "cortex/blas-netlib"]
ndarray-blas-openblas = ["cortex/ndarray", "cortex/openblas"]
tch-cpu = ["cortex/tch"]
tch-gpu = ["cortex/tch"]
remote = ["cortex/remote"]
wgpu = ["cortex/wgpu", "cortex/default"]
metal = ["cortex/metal", "cortex/default"]
cuda = ["cortex/cuda"]
vulkan = ["cortex/vulkan", "cortex/default"]
rocm = ["cortex/rocm", "cortex/default"]

[dependencies]
# Disable autotune default for now.
cortex = { path = "../../crates/cortex", features = [
    "train",
    "metrics",
    "std",
    "rl",
    # "fusion",
    "ndarray",
    # "autotune",
], default-features = false }
# Just for this example.
gym-rs = { version = "0.3.1", branch = "main", git = "https://github.com/MathisWellmann/gym-rs" }
rand.workspace = true
derive-new = { workspace = true }

[lints]
workspace = true
