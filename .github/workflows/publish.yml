      - publish-cortex-autodiff
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-tch
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-ndarray:
    needs:
      - publish-cortex-ir
      - publish-cortex-tensor
      - publish-cortex-autodiff
      - publish-cortex-std
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-ndarray
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-wgpu:
    needs:
      - publish-cortex-tensor
      - publish-cortex-autodiff
      - publish-cortex-ndarray
      - publish-cortex-std
      - publish-cortex-cubecl
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-wgpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-cpu:
    needs:
      - publish-cortex-tensor
      - publish-cortex-fusion
      - publish-cortex-cubecl
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-cpu
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-cuda:
    needs:
      - publish-cortex-tensor
      - publish-cortex-autodiff
      - publish-cortex-ndarray
      - publish-cortex-std
      - publish-cortex-cubecl
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-cuda
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-rocm:
    needs:
      - publish-cortex-tensor
      - publish-cortex-autodiff
      - publish-cortex-ndarray
      - publish-cortex-std
      - publish-cortex-cubecl
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-rocm
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-candle:
    needs:
      - publish-cortex-tensor
      - publish-cortex-autodiff
      - publish-cortex-tch
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-candle
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-collective:
    needs:
      - publish-cortex-std
      - publish-cortex-tensor
      - publish-cortex-communication
      # dev dependencies
      - publish-cortex-wgpu
      - publish-cortex-ndarray
      - publish-cortex-cuda
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-collective
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-communication:
    needs:
      - publish-cortex-std
      - publish-cortex-tensor
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-communication
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-core:
    needs:
      - publish-cortex-dataset
      - publish-cortex-std
      - publish-cortex-derive
      - publish-cortex-tensor
      - publish-cortex-vision
      # dev dependencies
      - publish-cortex-autodiff
      - publish-cortex-wgpu
      - publish-cortex-tch
      - publish-cortex-cuda
      - publish-cortex-ndarray
      - publish-cortex-candle
      - publish-cortex-remote
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-core
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-nn:
    needs:
      - publish-cortex-core
      # dev dependencies
      - publish-cortex-autodiff
      - publish-cortex-wgpu
      - publish-cortex-tch
      - publish-cortex-ndarray
      - publish-cortex-candle
      - publish-cortex-remote
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-nn
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-optim:
    needs:
      - publish-cortex-core
      - publish-cortex-collective
      # dev dependencies
      - publish-cortex-autodiff
      - publish-cortex-wgpu
      - publish-cortex-tch
      - publish-cortex-ndarray
      - publish-cortex-candle
      - publish-cortex-remote
      - publish-cortex-nn
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-optim
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
    secrets:
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}

  publish-cortex-train:
    needs:
      - publish-cortex-core
      - publish-cortex-optim
      - publish-cortex-collective
      - publish-cortex-rl
      - publish-cortex-ndarray
    uses: qora-protocol/github-actions/.github/workflows/publish-crate.yml@v9
    with:
      crate: cortex-train
      dry-run-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run-only || false }}
