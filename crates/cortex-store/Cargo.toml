[package]
authors = ["Dilshod Tadjibaev (@antimora)"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Storage and serialization infrastructure for Cortex"
documentation = "https://docs.rs/cortex-store"
edition.workspace = true
keywords = [
    "deep-learning",
    "machine-learning",
    "tensor",
    "storage",
    "serialization",
]
license.workspace = true
name = "cortex-store"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-store"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "pytorch", "safetensors", "burnpack", "memmap"]
memmap = ["std", "dep:memmap2"]
std = [
    "dep:memmap2",
    "safetensors/std",
    "cortex-core/std",
    "cortex-tensor/std",
    "dep:regex",
    "byteorder/std",
]
tracing = [
    "cortex-core/tracing",
    "cortex-cuda?/tracing",
    "cortex-nn/tracing",
    "cortex-tch?/tracing",
    "cortex-tensor/tracing",
    "cortex-wgpu?/tracing",
]


burnpack = ["serde", "ciborium"]
cuda = ["cortex-cuda"]
metal = ["wgpu", "cortex-wgpu/metal"]
tch = ["cortex-tch"]
wgpu = ["cortex-wgpu"]

safetensors = ["dep:safetensors"]

pytorch = ["cortex-core/record-item-custom-serde", "zip", "serde", "tar"]

[dependencies]
cortex-core = { path = "../cortex-core", version = "=0.21.0-pre.1", default-features = false }
cortex-nn = { path = "../cortex-nn", version = "=0.21.0-pre.1", default-features = false }
cortex-tensor = { path = "../cortex-tensor", version = "=0.21.0-pre.1", default-features = false }

# External dependencies
byteorder = { workspace = true, default-features = false }
bytes = { workspace = true }
ciborium = { workspace = true, optional = true }
half = { workspace = true }
hashbrown = { workspace = true, features = ["serde"] }
memmap2 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
textdistance = { workspace = true }
zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }

# Workaround to force broken minor version to update
lzma-rust2 = { workspace = true, optional = true }

safetensors = { workspace = true, optional = true }

# Optional backend dependencies for benchmarks
cortex-cuda = { path = "../cortex-cuda", version = "=0.21.0-pre.1", optional = true }
cortex-tch = { path = "../cortex-tch", version = "=0.21.0-pre.1", optional = true }
cortex-wgpu = { path = "../cortex-wgpu", version = "=0.21.0-pre.1", optional = true }

[dev-dependencies]
# cortex-import = { path = "../cortex-import", version = "=0.21.0-pre.1" } # disabled (circular dep in publish, only for bench)
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1" }
divan = "0.1"
tempfile = { workspace = true }

[[bench]]
harness = false
name = "resnet18_loading"

[[bench]]
harness = false
name = "unified_loading"

[[bench]]
harness = false
name = "unified_saving"

[[bench]]
harness = false
name = "zero_copy_loading"

# Enable extra-platforms for bytes on targets without native atomics (e.g., thumbv6m-none-eabi)
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
bytes = { workspace = true, features = ["extra-platforms"] }
