[package]
authors = [
  "nathanielsimard <nathaniel.simard.42@gmail.com>",
  "Dilshod Tadjibaev (@antimora)",
]
edition.workspace = true
license.workspace = true
name = "cortex-no-std-tests"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-no-std-tests"
version.workspace = true

[lints]
workspace = true

[features]
default = []

tracing = [
    "cortex/tracing",
    "cortex-ndarray/tracing",
    "cortex-store/tracing",
]

[dependencies]

# ** Please make sure all dependencies support no_std **

cortex = { path = "../cortex", version = "=0.21.0-pre.1", default-features = false }
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1", default-features = false }

cortex-store = { path = "../cortex-store", version = "=0.21.0-pre.1", default-features = false, features = ["safetensors", "burnpack"]}
