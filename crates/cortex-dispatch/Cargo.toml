[package]
authors = [
    "laggui <lagrange.guillaume.1@gmail.com>",
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
]
categories = ["science"]
description = "Backend dispatch for the Cortex framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-dispatch"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-dispatch"
documentation = "https://docs.rs/cortex-dispatch"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "autodiff",
    "cortex-autodiff?/default",
    "cortex-cpu?/default",
    "cortex-cuda?/default",
    "cortex-ndarray?/default",
    "cortex-rocm?/default",
    "cortex-tch?/default",
    "cortex-wgpu?/default",
]
doc = ["default"]
std = [
    "cortex-backend/std",
    "cortex-std/std",
    "cortex-autodiff?/std",
    "cortex-cpu?/std",
    "cortex-cuda?/std",
    "cortex-ndarray?/std",
    "cortex-rocm?/std",
    "cortex-tch?/std",
    "cortex-wgpu?/std",
]
tracing = [
    "cortex-autodiff?/tracing",
    "cortex-cpu?/tracing",
    "cortex-cuda?/tracing",
    "cortex-ndarray?/tracing",
    "cortex-rocm?/tracing",
    "cortex-tch?/tracing",
    "cortex-wgpu?/tracing",
]

# Backends
cuda = ["cortex-cuda"]
rocm = ["cortex-rocm"]
ndarray = ["cortex-ndarray"]
tch = ["cortex-tch"]
vulkan = ["wgpu", "cortex-wgpu/vulkan"]
webgpu = ["wgpu", "cortex-wgpu/webgpu"]
metal = ["wgpu", "cortex-wgpu/metal"]
wgpu = ["cortex-wgpu"]
cpu = ["cortex-cpu"]
autodiff = ["cortex-autodiff"]

[dependencies]
cortex-backend = { path = "../cortex-backend", version = "=0.21.0-pre.1", default-features = false }
cortex-std = { path = "../cortex-std", version = "=0.21.0-pre.1", default-features = false }

# Backends
cortex-autodiff = { path = "../cortex-autodiff", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-cpu = { path = "../cortex-cpu", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-cuda = { path = "../cortex-cuda", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-tch = { path = "../cortex-tch", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-rocm = { path = "../cortex-rocm", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-wgpu = { path = "../cortex-wgpu", version = "=0.21.0-pre.1", optional = true, default-features = false }

# Op macros with `.as_$inner_kind()`
paste = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
