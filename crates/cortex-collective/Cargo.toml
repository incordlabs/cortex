[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Backend extension for collective calculations."
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "collective"]
license.workspace = true
name = "cortex-collective"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-collective"
documentation = "https://docs.rs/cortex-collective"
version.workspace = true

[lints]
workspace = true

[features]
default = []
doc = []
tracing = [
    "dep:tracing",
    "cortex-std/tracing",
    "cortex-tensor/tracing",
    "cortex-communication/tracing",
    "cortex-ndarray?/tracing",
    "cortex-wgpu?/tracing",
    "cortex-cuda?/tracing",
]
orchestrator = ["cortex-communication/websocket"]

# Backends for testing
test-ndarray = ["cortex-ndarray"]
test-wgpu = ["cortex-wgpu", "cortex-wgpu/webgpu"]
test-metal = ["cortex-wgpu", "cortex-wgpu/metal"]
test-vulkan = ["cortex-wgpu", "cortex-wgpu/vulkan"]
test-cuda = ["cortex-cuda"]

[dependencies]
cortex-tensor = { path = "../cortex-tensor", version = "=0.21.0-pre.1", default-features = true }
cortex-std = { path = "../cortex-std", version = "=0.21.0-pre.1", default-features = true }

log = { workspace = true }

cortex-communication = { path = "../cortex-communication", version = "=0.21.0-pre.1", features = [
    "data-service",
    "websocket",
] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "signal",
    "time",
    "tracing",
] }
serde = { workspace = true, features = ["derive"] }
rmp-serde = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, optional = true }

# Tests
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1", optional = true }
cortex-wgpu = { path = "../cortex-wgpu", version = "=0.21.0-pre.1", optional = true }
cortex-cuda = { path = "../cortex-cuda", version = "=0.21.0-pre.1", optional = true }

[dev-dependencies]
serial_test = { workspace = true }


[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
