[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Kernel fusion backend decorator for the Cortex framework"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-fusion"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-fusion"
documentation = "https://docs.rs/cortex-fusion"
version.workspace = true

[lints]
workspace = true

[features]
default = ["std", "tracing"]
std = ["serde/std", "tracing?/std"]
doc = ["default"]
memory-checks = ["std"]

tracing = [
    "dep:tracing",
    "cortex-backend/tracing",
    "cortex-ir/tracing",
]

[dependencies]
cortex-backend = { path = "../cortex-backend", version = "=0.21.0-pre.1" }
cortex-ir = { path = "../cortex-ir", version = "=0.21.0-pre.1" }
tracing = { workspace = true, optional = true, features = ["attributes"] }

hashbrown = { workspace = true }
derive-new = { workspace = true }
spin = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
