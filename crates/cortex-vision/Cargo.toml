[package]
authors = [
    "nathanielsimard <nathaniel.simard.42@gmail.com>",
    "wingertge <wingertge@gmail.com>",
]
categories = ["science"]
description = "Vision processing operations for cortex tensors"
documentation = "https://docs.rs/cortex-vision"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "gpu"]
license.workspace = true
name = "cortex-vision"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-vision"
version.workspace = true

[lints]
workspace = true


[features]
default = ["ndarray", "cubecl-backend", "fusion", "std"]
std = ["aligned-vec/std"]
tracing = [
    "cortex-cubecl?/tracing",
    "cortex-fusion?/tracing",
    "cortex-ir/tracing",
    "cortex-ndarray?/tracing",
    "cortex-tch?/tracing",
    "cortex-tensor/tracing",
    "cubecl/tracing",
]

cubecl-backend = ["cubecl", "cortex-cubecl"]
fusion = ["cortex-fusion", "cortex-cuda/fusion", "cortex-wgpu/fusion"]
ndarray = ["cortex-ndarray"]
tch = ["cortex-tch"]

# Test features
test-cpu = []
test-cuda = ["cubecl-backend", ]
test-wgpu = ["cubecl-backend", ]
test-vulkan = ["cortex-wgpu/vulkan", "test-wgpu"]
test-metal = ["cortex-wgpu/metal", "test-wgpu"]

[dependencies]
aligned-vec = { version = "0.6", default-features = false }
bon = { workspace = true }
cortex-cubecl = { path = "../cortex-cubecl", version = "=0.21.0-pre.1", optional = true }
cortex-fusion = { path = "../cortex-fusion", version = "=0.21.0-pre.1", optional = true }
cortex-ir = { path = "../cortex-ir", version = "=0.21.0-pre.1" }
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1", optional = true }
cortex-tch = { path = "../cortex-tch", version = "=0.21.0-pre.1", optional = true }
cortex-tensor = { path = "../cortex-tensor", version = "=0.21.0-pre.1" }
cortex-tensor-testgen = { path = "../cortex-tensor-testgen", version = "=0.21.0-pre.1", optional = true }
bytemuck = { workspace = true }
cubecl = { workspace = true, optional = true }
derive-new = { workspace = true }
half = { workspace = true }
image = { version = "0.25" }
macerator = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
cortex-cuda = { path = "../cortex-cuda", version = "=0.21.0-pre.1", default-features = false }
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1" }
cortex-wgpu = { path = "../cortex-wgpu", version = "=0.21.0-pre.1", default-features = false }
cubecl = { workspace = true }
