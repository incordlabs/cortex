[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "Backend router decorator over the network."
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "data"]
license.workspace = true
name = "cortex-remote"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-router-remote"
documentation = "https://docs.rs/cortex-router-remote"
version.workspace = true

[lints]
workspace = true

[features]
default = ["client", "server"]
doc = []
tracing = [
    "cortex-communication/tracing",
    "cortex-ir/tracing",
    "cortex-router/tracing",
    "cortex-std/tracing",
    "cortex-backend/tracing",
]

client = ["tokio-tungstenite", "async-channel", "tokio/sync"]
server = [
    "tokio-tungstenite",
    "async-channel",
    "tokio/sync",
    "axum",
    "tracing-core/default",
    "tracing-subscriber/default",
]


[dependencies]
cortex-ir = { path = "../cortex-ir", version = "=0.21.0-pre.1", default-features = true }
cortex-backend = { path = "../cortex-backend", version = "=0.21.0-pre.1", default-features = true }
cortex-std = { path = "../cortex-std", version = "=0.21.0-pre.1", default-features = true }
cortex-router = { path = "../cortex-router", version = "=0.21.0-pre.1", default-features = true }
cortex-communication = { path = "../cortex-communication", version = "=0.21.0-pre.1", features = [
    "data-service",
    "websocket",
] }

bytes = { workspace = true }

# Basic dependencies
derive-new = { workspace = true }
log = { workspace = true }

# Shared dependencies
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true }
rmp-serde = { workspace = true }
futures-util = { workspace = true }

# Client dependencies
async-channel = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

# Server dependencies
axum = { workspace = true, features = ["ws"], optional = true }
tracing-core = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tokio-util = { workspace = true }

[dev-dependencies]
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1" }
cortex-tensor = { path = "../cortex-tensor", version = "=0.21.0-pre.1", default-features = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
