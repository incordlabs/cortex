[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Neural network building blocks for the Cortex deep learning framework"
documentation = "https://docs.rs/cortex-nn"
edition.workspace = true
keywords = ["deep-learning", "machine-learning", "tensor", "pytorch", "ndarray"]
license.workspace = true
name = "cortex-nn"
readme.workspace = true
repository = "https://github.com/qora-protocol/cortex/tree/main/crates/cortex-nn"
version.workspace = true

[lints]
workspace = true

[features]
default = [
    "std",
    "cortex-core/default",
]
doc = [
    "std",
    # Doc features
    "cortex-core/doc",
]
std = [
    "cortex-core/std",
    "num-traits/std",
]
tracing = [
    "cortex-core/tracing",
    "cortex-cuda?/tracing",
    "cortex-rocm?/tracing",
    "cortex-tch?/tracing",
    "cortex-wgpu?/tracing",
    "cortex-fusion?/tracing",
]

test-cuda = [
    "cortex-cuda/default",
] # To use cuda during testing, default uses ndarray.
test-rocm = [
    "cortex-rocm/default",
] # To use hip during testing, default uses ndarray.
test-tch = [
    "cortex-tch/default",
] # To use tch during testing, default uses ndarray.
test-wgpu = [
    "cortex-wgpu/default",
] # To use wgpu during testing, default uses ndarray.
test-vulkan = [
    "test-wgpu",
    "cortex-wgpu/vulkan",
] # To use wgpu-spirv during testing, default uses ndarray.
test-metal = [
    "test-wgpu",
    "cortex-wgpu/metal",
] # To use wgpu-spirv during testing, default uses ndarray.

# Memory checks are disabled by default
test-memory-checks = ["cortex-fusion/memory-checks"]

[dependencies]

# ** Please make sure all dependencies support no_std when std is disabled **
cortex-core = { path = "../cortex-core", version = "=0.21.0-pre.1", default-features = false }

num-traits = { workspace = true }

# FOR TESTING
cortex-cuda = { path = "../cortex-cuda", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-rocm = { path = "../cortex-rocm", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-remote = { path = "../cortex-remote", version = "=0.21.0-pre.1", default-features = false, optional = true }
cortex-router = { path = "../cortex-router", version = "=0.21.0-pre.1", default-features = false, optional = true }
cortex-tch = { path = "../cortex-tch", version = "=0.21.0-pre.1", optional = true }
cortex-wgpu = { path = "../cortex-wgpu", version = "=0.21.0-pre.1", optional = true, default-features = false }
cortex-fusion = { path = "../cortex-fusion", version = "=0.21.0-pre.1", optional = true }

[dev-dependencies]
cortex-ndarray = { path = "../cortex-ndarray", version = "=0.21.0-pre.1" }
cortex-autodiff = { path = "../cortex-autodiff", version = "=0.21.0-pre.1" }
rstest = { workspace = true }

[package.metadata.docs.rs]
features = ["doc"]
rustdoc-args = ["--cfg", "docsrs"]
